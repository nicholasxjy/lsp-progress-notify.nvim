<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="lsp-progress-notify.nvim UI redesign mockup">
  <defs>
    <linearGradient id="editor-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15171b"/>
      <stop offset="0.58" stop-color="#191b20"/>
      <stop offset="1" stop-color="#171a1f"/>
    </linearGradient>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="small-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .mono {
        font-family: "SFMono-Regular", "Menlo", "Cascadia Mono", "JetBrains Mono", monospace;
      }
      .ui {
        font-family: "Inter", "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      }
      .comment { fill: #6f7a86; }
      .keyword { fill: #c678dd; }
      .string { fill: #98c379; }
      .fn { fill: #61afef; }
      .muted { fill: #8f98a3; }
      .text { fill: #d8dee9; }
      .subtle { fill: #a4adb8; }
      .dim { fill: #707983; }
      .green { fill: #8bd17c; }
      .blue { fill: #7aa2f7; }
      .amber { fill: #e5c07b; }
      .panel { fill: #20242a; stroke: #3a414a; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#111318"/>
  <rect x="64" y="52" width="1312" height="796" rx="8" fill="url(#editor-bg)" stroke="#2b3037"/>

  <g class="ui">
    <rect x="64" y="52" width="1312" height="42" rx="8" fill="#202329"/>
    <rect x="64" y="86" width="1312" height="8" fill="#202329"/>
    <circle cx="88" cy="73" r="5.5" fill="#e06c75"/>
    <circle cx="108" cy="73" r="5.5" fill="#e5c07b"/>
    <circle cx="128" cy="73" r="5.5" fill="#98c379"/>
    <text x="720" y="78" fill="#a4adb8" font-size="13" text-anchor="middle">init.lua - Neovim</text>
    <text x="1334" y="78" fill="#707983" font-size="12" text-anchor="end">NORMAL</text>
  </g>

  <g class="mono" font-size="15">
    <rect x="64" y="94" width="54" height="714" fill="#171a1f"/>
    <line x1="118" y1="94" x2="118" y2="808" stroke="#272c33"/>
    <g fill="#5d6670" text-anchor="end">
      <text x="101" y="133">42</text>
      <text x="101" y="160">43</text>
      <text x="101" y="187">44</text>
      <text x="101" y="214">45</text>
      <text x="101" y="241">46</text>
      <text x="101" y="268">47</text>
      <text x="101" y="295">48</text>
      <text x="101" y="322">49</text>
      <text x="101" y="349">50</text>
      <text x="101" y="376">51</text>
      <text x="101" y="403">52</text>
      <text x="101" y="430">53</text>
      <text x="101" y="457">54</text>
      <text x="101" y="484">55</text>
      <text x="101" y="511">56</text>
      <text x="101" y="538">57</text>
      <text x="101" y="565">58</text>
      <text x="101" y="592">59</text>
      <text x="101" y="619">60</text>
      <text x="101" y="646">61</text>
      <text x="101" y="673">62</text>
      <text x="101" y="700">63</text>
      <text x="101" y="727">64</text>
    </g>

    <text x="142" y="133" class="comment">-- LSP progress should feel native: small, readable, and calm</text>
    <text x="142" y="187" class="keyword">local</text>
    <text x="194" y="187" class="text">progress = </text>
    <text x="286" y="187" class="fn">require</text>
    <text x="344" y="187" class="text">(</text>
    <text x="356" y="187" class="string">"lsp-progress-notify"</text>
    <text x="548" y="187" class="text">)</text>
    <text x="142" y="241" class="text">progress.</text>
    <text x="222" y="241" class="fn">setup</text>
    <text x="272" y="241" class="text">({</text>
    <text x="178" y="295" class="text">notification = {</text>
    <text x="214" y="349" class="text">render = </text>
    <text x="294" y="349" class="string">"compact"</text>
    <text x="374" y="349" class="text">,</text>
    <text x="214" y="403" class="text">stages = </text>
    <text x="294" y="403" class="string">"fade"</text>
    <text x="350" y="403" class="text">,</text>
    <text x="214" y="457" class="text">done_timeout = </text>
    <text x="342" y="457" class="amber">1400</text>
    <text x="382" y="457" class="text">,</text>
    <text x="178" y="511" class="text">},</text>
    <text x="178" y="565" class="text">format = </text>
    <text x="258" y="565" class="keyword">function</text>
    <text x="338" y="565" class="text">(client, task)</text>
    <text x="214" y="619" class="keyword">return</text>
    <text x="278" y="619" class="text">task.title .. </text>
    <text x="390" y="619" class="string">" · "</text>
    <text x="438" y="619" class="text"> .. task.message</text>
    <text x="178" y="673" class="keyword">end</text>
    <text x="142" y="727" class="text">})</text>
  </g>

  <g filter="url(#soft-shadow)">
    <rect x="869" y="132" width="430" height="252" rx="8" class="panel"/>
    <rect x="869" y="132" width="430" height="42" rx="8" fill="#252a31"/>
    <rect x="869" y="166" width="430" height="8" fill="#252a31"/>
    <rect x="869" y="132" width="4" height="252" rx="2" fill="#8bd17c"/>

    <g class="ui">
      <circle cx="900" cy="153" r="8" fill="none" stroke="#8bd17c" stroke-width="2"/>
      <path d="M900 145 A8 8 0 0 1 908 153" fill="none" stroke="#d8dee9" stroke-width="2.4" stroke-linecap="round"/>
      <text x="922" y="158" class="text" font-size="15" font-weight="600">lua_ls</text>
      <text x="1276" y="158" class="dim" font-size="12" text-anchor="end">LSP</text>
    </g>

    <g class="mono" font-size="14">
      <text x="900" y="211" class="green">●</text>
      <text x="922" y="211" class="text">workspace/symbols</text>
      <text x="1276" y="211" class="subtle" text-anchor="end">68%</text>
      <rect x="922" y="227" width="336" height="4" rx="2" fill="#343a43"/>
      <rect x="922" y="227" width="228" height="4" rx="2" fill="#8bd17c"/>

      <text x="900" y="262" class="blue">◌</text>
      <text x="922" y="262" class="text">indexing runtime files</text>
      <text x="1276" y="262" class="subtle" text-anchor="end">41%</text>
      <rect x="922" y="278" width="336" height="4" rx="2" fill="#343a43"/>
      <rect x="922" y="278" width="138" height="4" rx="2" fill="#7aa2f7"/>

      <text x="900" y="313" class="amber">✓</text>
      <text x="922" y="313" class="muted">semantic tokens ready</text>
      <text x="1276" y="313" class="dim" text-anchor="end">done</text>
    </g>
  </g>

  <g filter="url(#small-shadow)">
    <rect x="902" y="414" width="397" height="126" rx="8" fill="#1f2329" stroke="#383f48"/>
    <rect x="902" y="414" width="4" height="126" rx="2" fill="#7aa2f7"/>
    <g class="ui">
      <path d="M932 451 l7 7 l15 -18" fill="none" stroke="#8bd17c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="972" y="451" class="text" font-size="15" font-weight="600">pyright</text>
      <text x="972" y="480" class="subtle" font-size="13">environment resolved · diagnostics ready</text>
      <text x="1276" y="451" class="dim" font-size="12" text-anchor="end">1.4s</text>
    </g>
  </g>

  <g class="ui" filter="url(#small-shadow)">
    <rect x="156" y="780" width="1124" height="28" rx="6" fill="#20242a" stroke="#333941"/>
    <rect x="156" y="780" width="186" height="28" rx="6" fill="#2b3038"/>
    <text x="176" y="799" fill="#8bd17c" font-size="12" font-weight="600">lsp-progress-notify</text>
    <text x="370" y="799" fill="#a4adb8" font-size="12">single replaceable notification · per-server grouping · no history noise while loading</text>
    <text x="1258" y="799" fill="#707983" font-size="12" text-anchor="end">utf-8  lua</text>
  </g>

  <g class="ui">
    <text x="156" y="868" fill="#c9d1d9" font-size="15" font-weight="700">Design direction</text>
    <text x="300" y="868" fill="#8f98a3" font-size="14">compact notify window, Neovim-dark compatible palette, explicit progress only when the server reports percentage, quiet completed state</text>
  </g>
</svg>
